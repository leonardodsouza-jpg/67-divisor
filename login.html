<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>67 Divisor · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<header class="topo">
<svg class="logo" viewBox="0 0 64 72" role="img" aria-label="Chama sobre um bife"><path d="M32 2c4 9 14 14 14 26 0 5-2 9-5 12-1-5-3-8-6-10 1 5-1 8-3 10-2-3-3-6-2-10-4 3-7 7-7 12 0 2 0 3 1 5-5-3-8-7-8-12C16 19 28 14 32 2z" fill="#FF8A1F"/><path d="M32 24c2 5 7 8 7 14 0 4-3 7-7 7s-7-3-7-7c0-6 5-9 7-14z" fill="#FFC15A"/><path d="M10 52c0-7 9-10 22-10s22 3 22 10-9 16-22 16-22-9-22-16z" fill="#8A2E14"/><ellipse cx="30" cy="52" rx="16" ry="8" fill="#B8441F"/><path d="M20 52h20M30 46v12" stroke="#FBE3D0" stroke-width="2" stroke-linecap="round"/></svg>
<div><h1>67 Divisor</h1><p>Cada um paga só o que consumiu.</p></div></header>

<main class="login-wrap">
<div class="painel">
  <div class="abas" role="tablist" aria-label="Entrar ou criar grupo">
    <button type="button" role="tab" id="aba-entrar" aria-selected="true" class="aba">Entrar</button>
    <button type="button" role="tab" id="aba-criar" aria-selected="false" class="aba">Criar grupo</button>
  </div>
  <h2 id="titulo-login">Entrar no grupo</h2>
  <form id="form-login" class="linha" style="grid-template-columns:1fr" novalidate>
    <label>Nome do grupo<input id="grupo-nome" type="text" placeholder="Ex.: Amigos do Churrasco" autocomplete="username" required></label>
    <label>Senha<input id="grupo-senha" type="password" minlength="6" autocomplete="current-password" required></label>
    <label id="linha-confirma" hidden>Repita a senha<input id="grupo-senha2" type="password" minlength="6" autocomplete="new-password"></label>
    <p class="dica" id="dica-login">Use o nome e a senha que o grupo combinou.</p>
    <p class="aviso" id="msg-login" role="alert" hidden></p>
    <button type="submit" id="btn-login">Entrar</button>
  </form>
</div>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  let modo="entrar";
  function definirModo(m){
    modo=m;const criar=m==="criar";
    $("aba-entrar").setAttribute("aria-selected",!criar);$("aba-criar").setAttribute("aria-selected",criar);
    $("titulo-login").textContent=criar?"Criar um grupo novo":"Entrar no grupo";
    $("btn-login").textContent=criar?"Criar grupo":"Entrar";
    $("linha-confirma").hidden=!criar;$("grupo-senha2").required=criar;
    $("grupo-senha").autocomplete=criar?"new-password":"current-password";
    $("dica-login").textContent=criar?"Escolha um nome único e uma senha com pelo menos 6 caracteres. Compartilhe os dois só com o pessoal do churrasco.":"Use o nome e a senha que o grupo combinou.";
    $("msg-login").hidden=true;
  }
  const erro=t=>{$("msg-login").textContent=t;$("msg-login").hidden=false;};
  $("aba-entrar").addEventListener("click",()=>definirModo("entrar"));
  $("aba-criar").addEventListener("click",()=>definirModo("criar"));

  if(!window.Auth||!Auth.configurado){erro("O Supabase ainda não foi configurado. Preencha o arquivo supabase-config.js.");$("btn-login").disabled=true;return;}
  Auth.sessao().then(s=>{if(s)location.replace("index.html");});

  $("form-login").addEventListener("submit",async e=>{
    e.preventDefault();$("msg-login").hidden=true;
    const nome=$("grupo-nome").value.trim(),senha=$("grupo-senha").value;
    if(!Auth.slug(nome))return erro("Digite o nome do grupo (use letras ou números).");
    if(senha.length<6)return erro("A senha precisa ter pelo menos 6 caracteres.");
    if(modo==="criar"&&senha!==$("grupo-senha2").value)return erro("As senhas não são iguais.");
    $("btn-login").disabled=true;const txt=$("btn-login").textContent;$("btn-login").textContent="Aguarde…";
    try{modo==="criar"?await Auth.criar(nome,senha):await Auth.entrar(nome,senha);location.replace("index.html");}
    catch(err){erro(err.message);$("btn-login").disabled=false;$("btn-login").textContent=txt;}
  });
})();
</script>
</body></html>
